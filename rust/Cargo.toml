[package]
name = "thumbrella-client"
version = "1.3.5"
edition = "2024"
description = "Rust client for the Thumbrella thumbnail API - typed results, async streaming, caching"
license = "Apache-2.0"
repository = "https://github.com/thumbrella-dev/clients"
homepage = "https://thumbrella.dev"
documentation = "https://thumbrella.dev/docs/client"
keywords = ["thumbrella", "thumbnail", "image", "media"]
categories = ["api-bindings", "multimedia::images", "web-programming::http-client"]
readme = "README.md"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
async-stream = "0.3"
futures-core = "0.3"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
default = []
blocking = ["reqwest/blocking", "tokio"]

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "stream"
path = "examples/stream.rs"
