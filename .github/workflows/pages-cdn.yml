name: Deploy CDN (js.thumbrella.dev)

# Deploys the js.thumbrella.dev browser bundles (@thumbrella/client tbr.js +
# tbr.js.map) to the Cloudflare Pages project backing that domain.
#
# Manual trigger only. Runs on the repo's default branch; public/ is staged by
# scripts/build-cdn.ts. For each published version >= 1.2.0 the source is:
#   1. canonical  - a "client-js-v<version>" GitHub release exists: the RELEASED
#                   (attested) assets are downloaded, never rebuilt.
#   2. frozen     - legacy 1.2.0-1.4.0 with no release: the bytes already live
#                   on the CDN are copied unchanged (they are immutable-cached).
#   3. fallback   - neither (fresh publish racing its release): deterministic
#                   minified build from the npm tarball, byte-identical to the
#                   eventual release.
# Run AFTER npm publish and AFTER the client-js release/attestation workflow so
# the CDN serves exactly the attested bytes.
#
# Auth: CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID repo secrets.  The Pages
# project must already exist as a direct upload project (create once with
# `npx wrangler pages project create thumbrella-js`) and be connected to the
# js.thumbrella.dev custom domain.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cdn
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: pages-cdn
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # No package-lock.json is committed for libraries (see clients/.gitignore),
      # so install straight from the manifest instead of `npm ci`. esbuild is
      # pinned exactly so rebuilds are byte-deterministic.
      - run: npm install

      # Stage public/ (see build-cdn.ts for the canonical/frozen/fallback
      # resolution). GITHUB_TOKEN keeps the GitHub release lookup off the
      # unauthenticated rate limit.
      - name: Stage Pages deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx tsx scripts/build-cdn.ts

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy public --project-name thumbrella-js
