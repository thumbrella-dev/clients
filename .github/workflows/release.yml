name: Release Clients

# Publish client SDKs to their respective registries.
#
# Manual trigger only (workflow_dispatch). There is intentionally no push/tag
# trigger, so pushing a tag never starts a release. Only users with write
# access can run this workflow, and each publish job runs in a protected
# GitHub environment with a required reviewer.
#
# The tag must already exist — version bumping is done locally by
# platform/scripts/ci/prepare-release.py --scope clients.
#
# Attestation and auth:
#   npm:       trusted publishing (OIDC) + --provenance
#   PyPI:      trusted publishing (OIDC token exchange)
#   crates.io: actions/attest-build-provenance on the .crate file

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.2.0)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-clients-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # ---- derive version from the triggering ref or input ----------------------
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Determine tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # Reject malformed or unexpected tags before anything is published.
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
            echo "tag must look like v1.2.0 or v1.2.0-rc.1 (got: $TAG)" >&2
            exit 1
          }
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing tag=${TAG} version=${VERSION}"

  # ---- npm: @thumbrella/client ----------------------------------------------
  publish-npm:
    needs: version
    runs-on: ubuntu-latest
    environment: npm
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run build

      # Smoke check: verify the package loads
      - run: node -e "require('./dist/index.js'); console.log('OK')"

      # Trusted publishing (OIDC) — no npm token stored in the repo.
      # Requires: @thumbrella/client configured with a trusted publisher
      # pointing at this repo + workflow (environment "npm").
      - name: Publish to npm
        run: npm publish --provenance --access public

  # ---- PyPI: thumbrella-client ----------------------------------------------
  publish-pypi:
    needs: version
    runs-on: ubuntu-latest
    environment: pypi
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Trusted publishing (OIDC) — no token needed.
        # Requires: PyPI project configured with a pending publisher
        # pointing at this repo + workflow.

  # ---- crates.io: thumbrella-client -----------------------------------------
  publish-crates:
    needs: version
    runs-on: ubuntu-latest
    environment: crates
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      # Package first so we can attest the .crate file before publishing.
      - name: Package crate
        run: cargo package --no-verify

      - name: Attest crate
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            target/package/thumbrella-client-${{ needs.version.outputs.version }}.crate

      # crates.io has no trusted publishing yet; the token lives in the
      # "crates" environment and should be scoped to this one crate with
      # publish-only access.
      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
